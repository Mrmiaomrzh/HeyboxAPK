name: Heybox APK Daily Tracker

on:
  schedule:
    # GitHub Actions 使用 UTC
    # 12:00 UTC = 北京时间 20:00
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heybox-apk-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Environment Diagnostics
      # ============================================================

      - name: Environment Diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo " Environment Diagnostics"
          echo "=================================================="

          echo
          echo "=== System ==="
          uname -a

          echo
          echo "=== OS Release ==="
          cat /etc/os-release || true

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== Bash ==="
          bash --version | head -n 1

          echo
          echo "=== curl ==="
          curl --version | head -n 3

          echo
          echo "=== OpenSSL ==="
          openssl version

          echo
          echo "=== Python ==="
          python3 --version

          echo
          echo "=== Date ==="
          date
          date -R

          echo
          echo "=== Timezone ==="
          timedatectl 2>/dev/null || true

          echo
          echo "=== GitHub Runner ==="
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"

          echo
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-unknown}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unknown}"

      # ============================================================
      # Download APKs
      # ============================================================

      - name: Download APKs
        shell: bash
        run: |
          set -uo pipefail

          HOST="dl.max-c.com"

          RELEASE_URL="https://${HOST}/app/heybox/heybox-release.apk"
          BETA_URL="https://${HOST}/app/heybox/heybox-beta.apk"

          echo "=================================================="
          echo " Heybox APK Download Diagnostics"
          echo "=================================================="

          echo
          echo "Host: ${HOST}"

          # ========================================================
          # DNS Diagnostics
          # ========================================================

          echo
          echo "=================================================="
          echo " DNS Diagnostics"
          echo "=================================================="

          echo
          echo "--- /etc/resolv.conf ---"
          cat /etc/resolv.conf || true

          echo
          echo "--- getent hosts ---"
          getent hosts "$HOST" || true

          echo
          echo "--- IPv4 addresses ---"
          getent ahostsv4 "$HOST" 2>/dev/null | sort -u || true

          echo
          echo "--- IPv6 addresses ---"
          getent ahostsv6 "$HOST" 2>/dev/null | sort -u || true

          # ========================================================
          # Network Diagnostics
          # ========================================================

          echo
          echo "=================================================="
          echo " Network Connectivity"
          echo "=================================================="

          echo
          echo "--- IPv4 HTTPS connectivity ---"

          curl -4 \
            -vI \
            --connect-timeout 15 \
            --max-time 30 \
            "https://${HOST}/" \
            2>&1 || true

          echo
          echo "--- IPv6 HTTPS connectivity ---"

          curl -6 \
            -vI \
            --connect-timeout 15 \
            --max-time 30 \
            "https://${HOST}/" \
            2>&1 || true

          # ========================================================
          # TLS Diagnostics
          # ========================================================

          echo
          echo "=================================================="
          echo " TLS Diagnostics"
          echo "=================================================="

          echo
          echo "--- OpenSSL TLS handshake ---"

          timeout 30 \
            openssl s_client \
              -connect "${HOST}:443" \
              -servername "$HOST" \
              -brief \
              </dev/null \
              2>&1 || true

          echo
          echo "--- OpenSSL certificate information ---"

          timeout 30 \
            openssl s_client \
              -connect "${HOST}:443" \
              -servername "$HOST" \
              </dev/null 2>/dev/null \
            | openssl x509 \
              -noout \
              -subject \
              -issuer \
              -dates \
              -fingerprint \
              -sha256 \
              2>&1 || true

          # ========================================================
          # HTTP Diagnostics
          # ========================================================

          echo
          echo "=================================================="
          echo " HTTP Diagnostics"
          echo "=================================================="

          echo
          echo "--- Release HEAD ---"

          curl -4 \
            -I \
            --connect-timeout 30 \
            --max-time 60 \
            -A "$UA" \
            "$RELEASE_URL" \
            2>&1 || true

          echo
          echo "--- Beta HEAD ---"

          curl -4 \
            -I \
            --connect-timeout 30 \
            --max-time 60 \
            -A "$UA" \
            "$BETA_URL" \
            2>&1 || true

          # ========================================================
          # Download function
          # ========================================================

          download() {
            local url="$1"
            local output="$2"

            echo
            echo "=================================================="
            echo " Downloading APK"
            echo "=================================================="
            echo "URL: ${url}"
            echo "Output: ${output}"

            rm -f "$output"

            local attempt
            local exit_code

            for attempt in 1 2 3 4 5; do

              echo
              echo "--------------------------------------------------"
              echo "Attempt ${attempt}/5"
              echo "Time: $(date -R)"
              echo "--------------------------------------------------"

              rm -f "$output"

              set +e

              curl \
                -4 \
                --fail \
                --location \
                --show-error \
                --verbose \
                --connect-timeout 30 \
                --max-time 600 \
                --retry 0 \
                -A "$UA" \
                -o "$output" \
                "$url" \
                2>&1

              exit_code=$?

              set -e

              echo
              echo "curl exit code: ${exit_code}"

              if [ "$exit_code" -eq 0 ] && [ -s "$output" ]; then

                echo
                echo "✓ Download successful"

                echo
                echo "--- File information ---"
                ls -lh "$output"

                echo
                echo "--- file ---"
                file "$output" || true

                echo
                echo "--- SHA256 ---"
                sha256sum "$output"

                echo
                echo "--- APK header ---"
                xxd -l 32 "$output" 2>/dev/null || true

                return 0
              fi

              echo
              echo "✗ Download failed"

              if [ -f "$output" ]; then
                echo "Partial file:"
                ls -lh "$output" || true
              else
                echo "Output file does not exist"
              fi

              rm -f "$output"

              if [ "$attempt" -lt 5 ]; then
                echo
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            done

            # ======================================================
            # Final diagnostics
            # ======================================================

            echo
            echo "=================================================="
            echo " FINAL DOWNLOAD DIAGNOSTICS"
            echo "=================================================="

            echo
            echo "--- DNS ---"
            getent hosts "$HOST" || true

            echo
            echo "--- IPv4 ---"
            getent ahostsv4 "$HOST" 2>/dev/null | sort -u || true

            echo
            echo "--- IPv6 ---"
            getent ahostsv6 "$HOST" 2>/dev/null | sort -u || true

            echo
            echo "--- Final IPv4 HTTPS test ---"

            curl \
              -4 \
              -vI \
              --connect-timeout 30 \
              --max-time 60 \
              -A "$UA" \
              "$url" \
              2>&1 || true

            echo
            echo "--- Final TLS test ---"

            timeout 30 \
              openssl s_client \
                -connect "${HOST}:443" \
                -servername "$HOST" \
                -brief \
                </dev/null \
                2>&1 || true

            echo
            echo "=================================================="
            echo " Download failed permanently"
            echo "=================================================="

            return 1
          }

          # ========================================================
          # Download Release
          # ========================================================

          download \
            "$RELEASE_URL" \
            "heybox-release.apk"

          # ========================================================
          # Download Beta
          # ========================================================

          download \
            "$BETA_URL" \
            "heybox-beta.apk"

          # ========================================================
          # Download Summary
          # ========================================================

          echo
          echo "=================================================="
          echo " Download Summary"
          echo "=================================================="

          ls -lh heybox-*.apk

          echo
          echo "--- SHA256 ---"
          sha256sum heybox-*.apk

      # ============================================================
      # Analyze APKs
      # ============================================================

      - name: Analyze APKs
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(date +%Y%m%d)

          echo "DATE=$DATE" >> "$GITHUB_ENV"

          # ========================================================
          # Find AAPT
          # ========================================================

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "::error::找不到 aapt"
            exit 1
          fi

          echo "使用 $AAPT"

          echo
          echo "AAPT version:"
          "$AAPT" version || true

          # ========================================================
          # SDK name
          # ========================================================

          sdk_name() {
            case "$1" in
              19) echo "Android 4.4 (KitKat)";;
              21) echo "Android 5.0 (Lollipop)";;
              22) echo "Android 5.1 (Lollipop)";;
              23) echo "Android 6.0 (Marshmallow)";;
              24) echo "Android 7.0 (Nougat)";;
              25) echo "Android 7.1 (Nougat)";;
              26) echo "Android 8.0 (Oreo)";;
              27) echo "Android 8.1 (Oreo)";;
              28) echo "Android 9 (Pie)";;
              29) echo "Android 10";;
              30) echo "Android 11";;
              31) echo "Android 12";;
              32) echo "Android 12L";;
              33) echo "Android 13";;
              34) echo "Android 14";;
              35) echo "Android 15";;
              36) echo "Android 16";;
              37) echo "Android 17";;
              *) echo "Android (API $1)";;
            esac
          }

          # ========================================================
          # Analyze function
          # ========================================================

          analyze() {
            local channel="$1"
            local apk="$2"
            local url="$3"

            echo
            echo "=================================================="
            echo "Analyzing ${channel}"
            echo "APK: ${apk}"
            echo "=================================================="

            # ======================================================
            # AAPT badging
            # ======================================================

            local badging

            badging=$("$AAPT" dump badging "$apk")

            # ======================================================
            # Basic information
            # ======================================================

            local pkg
            local vname
            local vcode
            local mins
            local targs
            local label
            local abis

            pkg=$(
              sed \
                -n "s/^package: name='\([^']*\)'.*/\1/p" \
                <<<"$badging"
            )

            vcode=$(
              sed \
                -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" \
                <<<"$badging"
            )

            vname=$(
              sed \
                -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" \
                <<<"$badging"
            )

            mins=$(
              sed \
                -n "s/^sdkVersion:'\([^']*\)'/\1/p" \
                <<<"$badging"
            )

            targs=$(
              sed \
                -n "s/^targetSdkVersion:'\([^']*\)'/\1/p" \
                <<<"$badging"
            )

            label=$(
              sed \
                -n "s/^application-label-zh-CN:'\([^']*\)'/\1/p" \
                <<<"$badging" \
                || true
            )

            if [ -z "$label" ]; then
              label=$(
                sed \
                  -n "s/^application-label:'\([^']*\)'/\1/p" \
                  <<<"$badging" \
                  || true
              )
            fi

            abis=$(
              grep '^native-code:' <<<"$badging" \
                | sed "s/^native-code: //" \
                | tr -d "'" \
                | tr ' ' ',' \
                | sed 's/,$//' \
                || true
            )

            # ======================================================
            # Permissions
            # ======================================================

            mapfile -t perms < <(
              sed \
                -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
                <<<"$badging"
            )

            # ======================================================
            # Asset
            # ======================================================

            local asset="${channel^}-${vname}(${vcode})-${DATE}.apk"

            cp "$apk" "$asset"

            # ======================================================
            # Size / SHA256
            # ======================================================

            local size_h
            local size_b
            local sha256

            size_b=$(stat -c%s "$apk")

            size_h=$(
              numfmt \
                --to=iec \
                --suffix=B \
                "$size_b"
            )

            sha256=$(
              sha256sum "$apk" \
                | awk '{print $1}'
            )

            # ======================================================
            # APK certificate
            # ======================================================

            local cert_sha=""

            if command -v apksigner >/dev/null 2>&1 || \
              find "$ANDROID_HOME/build-tools" \
                -type f \
                -name apksigner \
                | grep -q .; then

              local apksigner

              apksigner=$(
                find "$ANDROID_HOME/build-tools" \
                  -type f \
                  -name apksigner \
                  | sort -V \
                  | tail -n 1
              )

              cert_sha=$(
                "$apksigner" verify \
                  --print-certs \
                  "$apk" \
                  2>/dev/null \
                  | sed \
                    -n 's/^Signer #1 certificate SHA-256 digest: //p' \
                  | head -n 1 \
                  || true
              )
            fi

            # ======================================================
            # Environment variables
            # ======================================================

            cat > "vars-${channel}.env" <<EOF
          CHANNEL_TITLE='${channel^}'
          VNAME='${vname}'
          VCODE='${vcode}'
          ASSET='${asset}'
          DATE='${DATE}'
          EOF

            # ======================================================
            # Permission Markdown
            # ======================================================

            local perm_md=""

            if [ "${#perms[@]}" -gt 0 ]; then

              perm_md="<details><summary>权限列表（${#perms[@]} 项）</summary>\n"

              local p

              for p in "${perms[@]}"; do
                perm_md+="\n- \`$p\`"
              done

              perm_md+="\n\n</details>"
            fi

            # ======================================================
            # Generate analysis Markdown
            # ======================================================

            {
              echo "## ${channel^} - ${label} ${vname} (${vcode})"
              echo ""

              echo "**文件名**：\`${asset}\`"
              echo ""

              echo "| 项目 | 值 |"
              echo "| --- | --- |"

              echo "| 应用名称 | ${label} |"

              echo "| 包名 | \`${pkg}\` |"

              echo "| 版本名称 | ${vname} |"

              echo "| 版本号 | ${vcode} |"

              echo "| 最低支持 SDK | API ${mins}（$(sdk_name "$mins")） |"

              echo "| 目标 SDK | API ${targs}（$(sdk_name "$targs")） |"

              echo "| 支持 ABI | ${abis:-无} |"

              echo "| 大小 | ${size_h}（${size_b} 字节） |"

              echo "| SHA-256 | \`${sha256}\` |"

              if [ -n "$cert_sha" ]; then
                echo "| 签名证书 SHA-256 | \`${cert_sha}\` |"
              fi

              echo "| 下载源 | ${url} |"

              echo "| 抓取日期（北京时间） | $(date '+%Y-%m-%d %H:%M') |"

              echo ""

              echo -e "$perm_md"

            } > "body-${channel}.md"

            echo
            echo "完成分析：$asset"

            echo "Package: $pkg"
            echo "Version Name: $vname"
            echo "Version Code: $vcode"
            echo "Min SDK: $mins"
            echo "Target SDK: $targs"
            echo "ABI: ${abis:-none}"
            echo "Size: $size_h"
            echo "SHA256: $sha256"

            if [ -n "$cert_sha" ]; then
              echo "Certificate SHA256: $cert_sha"
            fi
          }

          # ========================================================
          # Work directory
          # ========================================================

          mkdir -p work

          cd work

          # ========================================================
          # Analyze Release
          # ========================================================

          analyze \
            release \
            ../heybox-release.apk \
            "https://dl.max-c.com/app/heybox/heybox-release.apk"

          # ========================================================
          # Analyze Beta
          # ========================================================

          analyze \
            beta \
            ../heybox-beta.apk \
            "https://dl.max-c.com/app/heybox/heybox-beta.apk"

          # ========================================================
          # GitHub Step Summary
          # ========================================================

          {
            echo "# 📦 小黑盒 APK — ${DATE}"
            echo ""

            echo "### Release 渠道"
            cat body-release.md

            echo ""

            echo "### Beta 渠道"
            cat body-beta.md

          } >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # README analysis section
          # ========================================================

          cat \
            body-release.md \
            body-beta.md \
            > analysis-section.md

          python3 - <<'PYEOF'
          import pathlib

          p = pathlib.Path("../README.md")

          text = p.read_text(
              encoding="utf-8"
          )

          start_marker = "<!-- HEYBOX-ANALYSIS:START -->"
          end_marker = "<!-- HEYBOX-ANALYSIS:END -->"

          if start_marker not in text:
              raise RuntimeError(
                  f"找不到开始标记: {start_marker}"
              )

          if end_marker not in text:
              raise RuntimeError(
                  f"找不到结束标记: {end_marker}"
              )

          start = text.index(start_marker) + len(start_marker)

          end = text.index(
              end_marker,
              start
          )

          new = pathlib.Path(
              "analysis-section.md"
          ).read_text(
              encoding="utf-8"
          ).rstrip()

          updated = (
              text[:start]
              + "\n"
              + new
              + "\n"
              + text[end:]
          )

          p.write_text(
              updated,
              encoding="utf-8"
          )

          print("README 分析区块已更新")
          PYEOF

      # ============================================================
      # Publish Releases
      # ============================================================

      - name: Publish Releases
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |
          set -euo pipefail

          PUBLISHED=0

          cd work

          for channel in release beta; do

            echo
            echo "=================================================="
            echo "Processing ${channel}"
            echo "=================================================="

            # shellcheck disable=SC1091
            source "vars-${channel}.env"

            TAG="${channel}-v${VNAME}"

            echo "Channel: ${CHANNEL_TITLE}"
            echo "Version: ${VNAME}"
            echo "Version Code: ${VCODE}"
            echo "Asset: ${ASSET}"
            echo "Tag: ${TAG}"

            # ======================================================
            # Check existing release
            # ======================================================

            if gh release view "$TAG" >/dev/null 2>&1; then

              echo "::notice::Tag ${TAG} 已存在，跳过发布（分析结果见 Job Summary）"

              continue
            fi

            # ======================================================
            # Create release
            # ======================================================

            gh release create \
              "$TAG" \
              "$ASSET" \
              --title "${CHANNEL_TITLE} ${VNAME}（版本号 ${VCODE}）— ${DATE}" \
              --notes-file "body-${channel}.md"

            echo "已发布：${TAG}"

            PUBLISHED=1

          done

          # ========================================================
          # Update README
          # ========================================================

          if [ "$PUBLISHED" = 1 ]; then

            echo
            echo "=================================================="
            echo " Updating README"
            echo "=================================================="

            cd ..

            git config \
              user.name \
              "github-actions[bot]"

            git config \
              user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add README.md

            if git diff --cached --quiet; then

              echo "README 内容无变化，跳过提交"

            else

              git commit \
                -m "docs: 更新最新 APK 分析 — ${DATE}"

              git push origin HEAD

              echo "README 已更新并推送"

            fi

          else

            echo
            echo "无新版本，README 不变更"

          fi
